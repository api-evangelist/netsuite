  name: Oracle NetSuite SuiteTalk REST Record API
  description: REST Web Services API for creating, reading, updating, and deleting NetSuite records such as customers, vendors, sales orders, invoices, items, and journal entries. Authentication uses OAuth 2.0 (auth code, M2M client credentials, or token-based auth) against the account's suitetalk.api.netsuite.com endpoint.
